# Project Cognition — default configuration.
# Secrets (API keys) never go here — they live in `.env` only.

exchange:
  id: bybit
  # Bybit's unified account category CCXT needs for derivatives/spot routing.
  category: spot

symbols:
  - BTC/USDT
  - ETH/USDT

timeframes:
  - "1m"
  - "5m"

history:
  years: 5
  # Bybit's public OHLCV endpoint max candles per request (CCXT paginates for us).
  fetch_limit: 1000
  # Seconds to sleep between paginated requests, on top of CCXT's built-in
  # rate limiter, to stay well clear of Bybit's public endpoint limits.
  request_pause_seconds: 0.2

data_quality:
  # A gap larger than this many expected candles is flagged as an outage.
  max_gap_multiple: 2
  # Price move between consecutive candles beyond this many standard
  # deviations of recent returns is flagged as an outlier candidate.
  outlier_zscore: 6.0
  outlier_lookback: 200

# Backtesting cost model and validation harness. Fees/slippage are the
# conservative end of the spec: taker 0.1%, slippage 0.1% base / 0.5%
# during high-volatility candles.
backtest:
  initial_equity: 10000
  taker_fee: 0.001
  slippage_base: 0.001
  slippage_high_vol: 0.005
  latency_bars: 1
  fill_ratio: 1.0
  risk_per_trade: 0.01        # hard cap — values above 1% are rejected
  max_position_fraction: 0.95
  regime_window_days: 7
  regime_threshold: 0.03
  lockbox_months: 6           # most recent N months never used in training
  walkforward:
    train_days: 90
    test_days: 30
    warmup_bars: 200
  montecarlo:
    runs: 50
    noise_scale: 0.25

# Guardian A — Risk Engine. Config validation REFUSES values looser than
# the non-negotiable rules (risk>1%, halt>5%, governor>10% all rejected).
risk:
  risk_per_trade: 0.01
  kelly_fraction: 0.5
  daily_loss_halt: 0.05
  drawdown_governor_threshold: 0.10
  drawdown_governor_scale: 0.5
  max_trades_per_hour: 6
  max_trades_per_day: 30
  max_concurrent_positions: 2
  max_total_exposure: 1.0
  min_stop_pct: 0.001
  max_stop_pct: 0.02
  min_take_profit_pct: 0.001
  max_take_profit_pct: 0.05

# Order execution: limit-first (maker), market fallback on timeout.
execution:
  limit_timeout_seconds: 10.0
  poll_interval_seconds: 0.5
  fallback_to_market: true
  post_only: true

# Paper trading (Milestone 6).
paper:
  warmup_bars: 250
  buffer_bars: 600
  dashboard_every: 20
  watchdog_stale_multiple: 3.0
  vote_threshold: 0.15
  journal_path: data/journal.db
  dashboard_path: reports/dashboard.html
  alert_throttle_seconds: 300

# RL agent training (Milestone 3+). Stop/take-profit come out of the
# model, scaled by current volatility and clamped to these bounds; the
# Risk Engine adds its own hard clamps in Milestone 5.
training:
  episodes: 60
  episode_bars: 720
  eval_every: 10
  eval_fraction: 0.2
  seed: 0
  vol_stop_scale: 3.0
  min_stop_pct: 0.002
  max_stop_pct: 0.02
  reward_risk: 1.5

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  log_dir: logs
  reports_dir: reports
  models_dir: models
